<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>回家五次换乘</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1715;color:#f8f5ed;font-family:system-ui,"Microsoft Yahei",sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:14px;background:#17231f}.head{display:flex;justify-content:space-between;align-items:center}.head small{color:#f5c35c}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0}.hud div{background:#263a33;border-radius:10px;padding:8px;text-align:center;font-size:13px}.photo{height:120px;border-radius:12px;background-size:cover;background-position:center;position:relative;overflow:hidden}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06100bd9,transparent)}.photo strong{position:absolute;z-index:1;bottom:10px;left:12px;text-shadow:0 2px 4px #000}canvas{display:block;width:100%;height:min(58vh,500px);background:#27332f;border-radius:12px;margin-top:10px;touch-action:none}.controls{display:flex;gap:8px;margin-top:10px}.controls button,.start{flex:1;border:0;border-radius:12px;padding:14px;background:#2c4439;color:#fff;font-size:17px;font-weight:700}.start{background:#f0be55;color:#18251f}.hint{text-align:center;color:#bcc8be;font-size:12px;margin:8px}.modal{position:fixed;inset:0;background:#06100bd9;display:grid;place-items:center;padding:20px;z-index:4}.card{max-width:460px;background:#20352d;border:1px solid #ffffff25;border-radius:20px;padding:24px;text-align:center}.card h1{color:#f5c35c}.card button{width:100%;border:0;border-radius:12px;padding:14px;background:#f0be55;font-size:17px;font-weight:bold}.hide{display:none}.bar{height:6px;background:#ffffff22;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#f5c35c}
</style></head><body><div class="wrap"><header class="head"><b>回家五次换乘</b><small id="stage">准备出发 · 苏州 07:20</small></header><section class="hud"><div>倒计时<br><b id="time">35</b> 秒</div><div>体重<br><b id="weight">正常</b></div><div>路上零食<br><b id="snack">0</b></div></section><div class="photo" id="photo"><strong id="place">苏州地铁 · 赶往苏州北</strong></div><div class="bar"><i id="progress"></i></div><canvas id="game"></canvas><div class="controls"><button onclick="move(-1)">← 左</button><button onclick="jump()">跳 / 跨</button><button onclick="move(1)">右 →</button></div><p class="hint">躲开行李箱、乘客和路障；收集食物会加分，但让你变慢。键盘 ← → / 空格也可操作。</p></div><div class="modal" id="modal"><div class="card"><h1 id="mtitle">赶回邯郸</h1><p id="mtext">五段路程，五次换乘。左右换道躲障碍，按跳跃跨过地面障碍。收集小吃加分，但体重增加后会跑得更慢。撑过每一程，天黑前到村口。</p><button onclick="start()">开始赶路</button></div></div><script>
const cvs=document.getElementById("game"),ctx=cvs.getContext("2d"),stages=[
["苏州地铁 · 赶往苏州北","https://upload.wikimedia.org/wikipedia/commons/9/9c/Platform_of_Suzhou_North_Railway_Station_20220908.jpg"],
["苏州北站 · 赶上高铁","https://upload.wikimedia.org/wikipedia/commons/9/9c/Platform_of_Suzhou_North_Railway_Station_20220908.jpg"],
["邯郸东 · 找接驳车","https://upload.wikimedia.org/wikipedia/commons/6/6e/Handandong_Railway_Station_2018-05-30_192321.jpg"],
["县城 · 乡村摆渡车","https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Village_road_rural.jpg/720px-Village_road_rural.jpg"],
["村口 · 最后一段路","https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Village_road_rural.jpg/720px-Village_road_rural.jpg"]];
let lane=1,playerY=0,items=[],dist=0,score=0,food=0,hits=0,stage=0,left=35,running=false,last=0,spawn=0,timer;
function resize(){let r=cvs.getBoundingClientRect();cvs.width=r.width*devicePixelRatio;cvs.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener("resize",resize);resize();
function move(d){lane=Math.max(0,Math.min(2,lane+d))}function jump(){playerY=1}
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "||e.key==="ArrowUp")jump()});
let sx; cvs.addEventListener("touchstart",e=>sx=e.touches[0].clientX);cvs.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>25)move(dx>0?1:-1);else jump()});
function start(){lane=1;items=[];dist=score=food=hits=stage=0;left=35;running=true;last=performance.now();document.getElementById("modal").classList.add("hide");timer=setInterval(()=>{if(running&&stage===0){left--;document.getElementById("time").textContent=left;if(left<=0)finish(false)}},1000);requestAnimationFrame(loop)}
function loop(now){if(!running)return;let dt=Math.min(40,now-last);last=now;let speed=(.22-Math.min(.08,food*.012))*dt;dist+=speed;spawn+=dt;if(spawn>760){spawn=0;items.push({lane:Math.floor(Math.random()*3),y:-30,type:Math.random()<.33?"🍡":Math.random()<.5?"🧳":"🚶",good:false});if(Math.random()<.45)items.push({lane:Math.floor(Math.random()*3),y:-80,type:"🥞",good:true})}let w=cvs.clientWidth,h=cvs.clientHeight;ctx.clearRect(0,0,w,h);let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,"#9db5aa");bg.addColorStop(.5,"#506a5d");bg.addColorStop(1,"#202e28");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle="#263931";ctx.beginPath();ctx.moveTo(w*.2,0);ctx.lineTo(w*.8,0);ctx.lineTo(w*.98,h);ctx.lineTo(w*.02,h);ctx.fill();for(let i=1;i<3;i++){ctx.strokeStyle="#ffffff55";ctx.setLineDash([14,13]);ctx.beginPath();ctx.moveTo(w*(.2+i*.2),0);ctx.lineTo(w*(.02+i*.32),h);ctx.stroke()}ctx.setLineDash([]);items.forEach(o=>o.y+=speed*(o.y/h+.4));items=items.filter(o=>{let x=w*(.18+o.lane*.32),y=o.y;if(y>h*.76&&y<h*.9&&o.lane===lane){if(o.good){food++;score+=10}else if(playerY===0)hits++;o.y=h+50}ctx.font="30px sans-serif";ctx.textAlign="center";ctx.fillText(o.type,x,y);return y<h+40});playerY=Math.max(0,playerY-.045);let px=w*(.18+lane*.32),py=h*.82-playerY*80;ctx.font="48px sans-serif";ctx.fillText("👩🏻‍🎓",px,py);ctx.font="34px sans-serif";ctx.fillText("🧳",px+25,py+22);score+=1;document.getElementById("snack").textContent=food;document.getElementById("weight").textContent=food>5?"沉重":food>2?"变重":"正常";document.getElementById("progress").style.width=Math.min(100,dist/18)+"%";if(hits>=3){finish(false);return}if(dist>1800){stage++;dist=0;items=[];if(stage>=5){finish(true);return}document.getElementById("stage").textContent=stages[stage][0];document.getElementById("place").textContent=stages[stage][0];document.getElementById("photo").style.backgroundImage="url('"+stages[stage][1]+"')"}requestAnimationFrame(loop)}
function finish(win){running=false;clearInterval(timer);document.getElementById("mtitle").textContent=win?"到家了！":"差一点就赶上了";document.getElementById("mtext").textContent=win?"院里的灯亮着。得分 "+score+"，路上吃了 "+food+" 份小吃。":"撞到太多次或错过了发车。得分 "+score+"。再试一次，少吃一点或躲开人群。";document.querySelector("#modal button").textContent="再玩一次";document.getElementById("modal").classList.remove("hide")}
document.getElementById("photo").style.backgroundImage="url('"+stages[0][1]+"')";
</script></body></html>

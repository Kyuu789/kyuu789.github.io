</style><div class="app"><header class="top"><b>回家五次换乘</b><span class="tag" id="step">苏州 · 07:20</span></header><main class="scene" id="scene"><img id="photo" alt="实景旅程"><div class="shade"></div><div class="caption"><small id="mode">第一程 · 地铁</small><h1 id="title">赶上回家的车</h1><p id="desc">倒计时开始。拖着箱子，在人流里找到去苏州北站的换乘口。</p></div></main><section class="hud"><div class="stats"><span id="timer">距离发车 35:00</span><span id="weight">行李 12kg · 体重 正常</span></div><div class="bar"><i id="bar"></i></div></section><section class="actions" id="actions"></section><p class="note" id="note">选择画面中的行动继续。途中食物会让角色变重，移动耗时增加。</p><div class="source">实景素材：Wikimedia Commons。<a id="credit" target="_blank" rel="noopener">查看当前照片来源与许可</a></div></div><script>
const S=[
{m:"第一程 · 苏州地铁",t:"早高峰，去苏州北站",d:"车门将关。跟着换乘指示穿过站厅，别让行李箱卡在人群里。",time:"07:20",img:"https://upload.wikimedia.org/wikipedia/commons/9/9c/Platform_of_Suzhou_North_Railway_Station_20220908.jpg",src:"https://commons.wikimedia.org/wiki/File:Platform_of_Suzhou_North_Railway_Station_20220908.jpg",opts:[["跟着蓝色换乘牌","快，行李颠簸",1],["停下买煎饼","吃掉煎饼，体重增加",2],["挤进即将关闭的车门","可能撞到乘客",0]]},
{m:"第二程 · 苏州北高铁",t:"检票口正在停止检票",d:"找到车票上的检票口，拖箱穿过候车厅。",time:"08:05",img:"https://upload.wikimedia.org/wikipedia/commons/9/9c/Platform_of_Suzhou_North_Railway_Station_20220908.jpg",src:"https://commons.wikimedia.org/wiki/File:Platform_of_Suzhou_North_Railway_Station_20220908.jpg",opts:[["核对车票再冲刺","少走冤枉路",1],["买杯奶茶带上车","体重增加，心情变好",2],["走最近的闸机","直接上车",0]]},
{m:"第三程 · 邯郸东接驳车",t:"下车后寻找接驳点",d:"出站广场人声嘈杂，认准回县城的车牌。",time:"15:40",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Handan_East_Railway_Station.jpg/1280px-Handan_East_Railway_Station.jpg",src:"https://commons.wikimedia.org/wiki/Category:Handandong_Railway_Station",opts:[["问工作人员接驳车位置","准确但要等一会",1],["买个驴肉火烧","吃掉火烧，体重增加",2],["跟着同乡上车","赶上这一班",0]]},
{m:"第四程 · 县城乡村摆渡车",t:"天色渐暗，车窗外是回家的方向",d:"摆渡车沿县道颠簸。车上有人递来一包家乡点心。",time:"18:10",img:"https://upload.wikimedia.org/wikipedia/commons/1/1c/Rural_road_in_Hebei.jpg",src:"https://commons.wikimedia.org/wiki/Category:Hebei",opts:[["抱稳行李坐好","保存体力",0],["接过点心吃一点","体重增加，获得安慰",2],["提前下车抄近路","拖箱步行更费力",1]]},
{m:"第五程 · 步行进村",t:"村口的灯亮了",d:"最后一段土路。远处院里的灯亮着，家人在等你。",time:"19:30",img:"https://upload.wikimedia.org/wikipedia/commons/1/1c/Rural_road_in_Hebei.jpg",src:"https://commons.wikimedia.org/wiki/Category:Hebei",opts:[["拖着箱子慢慢走回家","终于到家",0],["吃下包里最后一块点心","开心但步子更沉",2],["给家里打电话报平安","家人来村口接你",1]]}];
let n=-1,kg=12,mins=35,tick;const $=x=>document.getElementById(x);
function start(){n=0;kg=12;mins=35;render();clearInterval(tick);tick=setInterval(()=>{if(n===0&&mins>0){mins--; $("timer").textContent="距离发车 "+String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");$("bar").style.width=(mins/35*100)+"%"}},60000)}
function render(){if(n>=S.length){$("mode").textContent="抵达 · 邯郸村口";$("title").textContent="院里的灯一直亮着";$("desc").textContent="你到家了。行李箱滚过最后一段路，家门打开。";$("actions").innerHTML='<button class="start" onclick="start()">再走一遍</button>';return}
const s=S[n];$("step").textContent=s.time+" · "+(n+1)+"/5";$("mode").textContent=s.m;$("title").textContent=s.t;$("desc").textContent=s.d;$("photo").src=s.img;$("credit").href=s.src;$("scene").classList.remove("go");void $("scene").offsetWidth;$("scene").classList.add("go");$("weight").textContent="行李 12kg · 体重 "+(kg<14?"正常":kg<17?"微胖":"沉重");$("actions").innerHTML=s.opts.map((o,i)=>'<button onclick="act('+i+')"><b>'+o[0]+'</b>'+o[1]+'</button>').join("")}
function act(i){let s=S[n],o=s.opts[i];if(o[1].includes("吃"))kg+=1.5;let delay=kg>16?3:kg>14?2:1; $("note").textContent=o[1]+"。"+(kg>16?"身体变沉，行动明显慢下来。":"");if(n===0&&mins<1){$("desc").textContent="错过了高铁，但你仍继续想办法回家。"}setTimeout(()=>{n++;render()},900*delay)}
render();</script>

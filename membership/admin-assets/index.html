<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>可可西里单词屋 · 管理员</title>
<style>
:root{color-scheme:light;--ink:#34443e;--muted:#718078;--mint:#dff2e8;--green:#477b64;--pink:#f6e3e8;--paper:#fffdf8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;background:linear-gradient(145deg,#e6f4eb,#fff8f2 60%,#f8e9ee);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--ink)}
main{max-width:520px;margin:6vh auto;background:var(--paper);border:1px solid #e6eee7;border-radius:24px;padding:28px;box-shadow:0 18px 55px #526b5b18}
h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);line-height:1.65}.tag{display:inline-block;background:var(--mint);padding:5px 11px;border-radius:99px;font-size:12px;color:var(--green);margin-bottom:14px}
label{display:block;font-size:14px;font-weight:650;margin:18px 0 7px}input,select{width:100%;border:1px solid #dce6df;border-radius:12px;padding:13px;font:inherit;background:white;color:var(--ink)}
button{border:0;border-radius:12px;padding:13px 17px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:white;width:100%;margin-top:16px}
button.secondary{background:var(--pink);color:#704d58}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{font-size:12px;background:#f5f6ef;border-radius:12px;padding:12px;margin-top:16px;color:#68766e}
#error{color:#a33b4b;min-height:24px;font-size:14px}#results{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f7f2;border-radius:12px;padding:14px;line-height:1.9;font-family:ui-monospace,monospace}
.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto;margin:0;padding:9px 12px}
@media(max-width:420px){main{padding:22px 18px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="tag">COCO XILI · PRIVATE ADMIN</div>
<h1>可可西里单词屋</h1>
<p>会员兑换码管理。请只在自己的设备上登录，不要把管理员密码或兑换码发到公开群聊。</p>
<section id="login">
<label for="api">会员服务地址</label>
<input id="api" type="url" placeholder="自动使用当前 Worker 地址" autocomplete="url">
<label for="password">管理员密码</label>
<input id="password" type="password" autocomplete="current-password" placeholder="输入管理员密码">
<button id="loginBtn">安全登录</button>
</section>
<section id="panel" class="hidden">
<div class="top"><strong>生成兑换码</strong><button class="secondary" id="logoutBtn">退出登录</button></div>
<div class="row">
<div><label for="count">生成数量</label><select id="count"><option>1</option><option>5</option><option>10</option><option>20</option><option>50</option><option>100</option></select></div>
<div><label for="days">有效天数</label><select id="days"><option value="7">7 天</option><option value="30" selected>30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option></select></div>
</div>
<button id="generateBtn">生成兑换码</button>
<div id="resultBox" class="hidden"><label>本次生成结果（只显示一次）</label><div id="results"></div><button class="secondary" id="copyBtn">复制全部兑换码</button></div>
</section>
<div id="error" role="status" aria-live="polite"></div>
<div class="notice">登录会话有效期为 30 分钟，关闭此标签页会清除登录状态。兑换码生成后请立即保存，页面不会提供再次查看功能。</div>
</main>
<script>
const $=id=>document.getElementById(id);
let api="",token=sessionStorage.getItem("coco_admin_token")||"";
function showError(message){$("error").textContent=message||""}
function validApi(value){try{const u=new URL(value);return u.protocol==="https:"?u.origin:""}catch{return ""}}
function setLoggedIn(value){$("login").classList.toggle("hidden",value);$("panel").classList.toggle("hidden",!value)}
$("api").value=sessionStorage.getItem("coco_worker_url")||location.origin;
if(token){api=$("api").value; if(validApi(api))setLoggedIn(true);else{token="";sessionStorage.removeItem("coco_admin_token")}}
$("loginBtn").addEventListener("click",async()=>{
 api=validApi($("api").value.trim());const password=$("password").value;
 if(!api||!password){showError("请填写正确的 HTTPS 服务地址和管理员密码。");return}
 $("loginBtn").disabled=true;showError("正在验证…");
 try{
  const r=await fetch(api+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error(data.error||"登录失败");
  token=data.token;sessionStorage.setItem("coco_admin_token",token);sessionStorage.setItem("coco_worker_url",api);
  $("password").value="";setLoggedIn(true);showError("");
 }catch(e){showError(e.message||"连接失败，请检查服务地址。")}
 finally{$("loginBtn").disabled=false}
});
$("generateBtn").addEventListener("click",async()=>{
 $("generateBtn").disabled=true;showError("正在生成…");$("resultBox").classList.add("hidden");
 try{
  const r=await fetch(api+"/api/admin/codes",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({count:Number($("count").value),days:Number($("days").value)})});
  const data=await r.json();
  if(r.status===401){token="";sessionStorage.removeItem("coco_admin_token");setLoggedIn(false);throw new Error("登录已过期，请重新登录。")}
  if(!r.ok||!data.ok)throw new Error(data.error||"生成失败");
  $("results").textContent=data.codes.join("\n");$("resultBox").classList.remove("hidden");showError("");
 }catch(e){showError(e.message||"生成失败")}
 finally{$("generateBtn").disabled=false}
});
$("copyBtn").addEventListener("click",async()=>{
 try{await navigator.clipboard.writeText($("results").textContent);$("copyBtn").textContent="已复制 ✓"}
 catch{showError("自动复制失败，请长按兑换码文本手动复制。")}
});
$("logoutBtn").addEventListener("click",()=>{token="";sessionStorage.removeItem("coco_admin_token");$("resultBox").classList.add("hidden");setLoggedIn(false);showError("已退出登录。")});
</script>
</body>
</html>
